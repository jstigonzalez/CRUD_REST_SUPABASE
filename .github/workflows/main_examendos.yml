# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
name: Build and deploy JAR app to Azure Web App - ExamenDos

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      DB_USER_SUPABASE: ${{ secrets.DB_USER_SUPABASE }}
      DB_PWD_SUPABASE: ${{ secrets.DB_PWD_SUPABASE }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'

      - name: Build with Maven
        run: mvn -DskipTests package

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: "target/*.jar"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6F852A0DE01A411CA09A4A7653AD0912 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9D0DB6A36FAB44BBB914026A55800B05 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DE9AC766EC534404A18D97A0A61AA83A }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ExamenDos'
          slot-name: 'Production'
          package: './java-app/*.jar'

          

